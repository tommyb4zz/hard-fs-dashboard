# Recover the two Micron flash chips before probing. The upstream board setup can leave
# a warm-reset chip in a different instruction width. 0x66/0x99 reset volatile protocol
# state; these commands do not erase stored contents. Tested on this STM32H750B-DK.
proc dashboard_qspi_recover {} {
    qspi_init 0
    foreach width {3 2 1} {
        foreach opcode {0x66 0x99} {
            mmw 0x52005000 2 0
            mww 0x52005014 [expr {($width << 8) | $opcode}]
            sleep 10
        }
    }
    qspi_init 0
    flash probe 1
    # OpenOCD can report a successful probe with no JEDEC ID and a zero-size bank.
    set bank [lindex [flash list] 1]
    if {[dict get $bank size] != 0x08000000} {
        error "Dashboard QSPI identification failed; refusing to write"
    }
}
